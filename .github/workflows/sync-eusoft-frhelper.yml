name: Check & Auto-Update Frhelper to AUR

on:
  schedule:
    # Run every day at 03:13 UTC (11:13 AM CST, off-peak minute)
    - cron: '13 3 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync and push to AUR even if version has not changed'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-eusoft-frhelper
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Upstream Version and Hash
        id: check_upstream
        run: |
          python3 .github/scripts/check_and_update.py \
            --mode deb \
            --pkg-dir eusoft-frhelper \
            --deb-url "https://static.frdic.com/pkg/frhelper.deb"

      - name: Commit and Push Update to GitHub
        if: steps.check_upstream.outputs.has_update == 'true'
        env:
          COMMIT_MSG: ${{ steps.check_upstream.outputs.commit_msg }}
        run: .github/scripts/commit_and_push_github.sh eusoft-frhelper "$COMMIT_MSG"

      - name: Push to AUR
        if: steps.check_upstream.outputs.has_update == 'true' || inputs.force_sync == true
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: .github/scripts/push_aur.sh eusoft-frhelper
